# 全局参数（所有用例共享基线；cases/*.yaml 的 params / web 用例参数 JSON 覆盖同名项）
# 用例文本不含 ${param.xxx}；接口文档 body 声明 ${param.xxx} 引用，值由此注入
# 参数名统一 Python 风格（snake_case）：文档里 ${param.startIp} 这类驼峰引用
#   解析时自动归一（startIp→start_ip），yaml 一个语义只留一个键
# 登录凭据走环境变量：export TEST_ADMIN_USER=... TEST_ADMIN_PASSWORD=...（executor.login 优先读）
#
# 资源类参数支持「多个」：值填列表时（如 classroom_name: [c1, c2]），
#   执行器自动按最长列表展开批量创建（同一步骤执行 N 次，列表参数取第 i 个，标量参数每次相同）；
#   也可用 ${param.x[N]} 显式取第 N 个。配置规格类保持单个不展开。

# ── 测试环境 ──
base_url: https://10.51.167.250:8443/rcdc     # 目标环境地址（也可 --base-url 或环境变量 BASE_URL 注入）
rcdc_user: admin9
rcdc_passwd: Admin123      # 登录密码（明文，executor 内部自动 AES 加密）

# ── 教室（可多个：值填列表）──
classroom_name: [a_classroom_01]              # 教室名，多个: [c1, c2]
classroom_strategy_name: [a_cl_strategy_01]   # 教室策略名
teacher_mode: PC                              # 教师机工作模式（PC/VDI/IDV/TCI）。默认 PC：教师机无需分配镜像；
                                              #   用例需要 TCI/VDI/IDV 教师机时在 cases/*.yaml 覆盖此参数，
                                              #   且该用例流程须包含教师机镜像分配（lessonImage/image teacher create）
student_mode_arr: [VDI]                       # 学生机类型数组（PC/VDI/IDV/TCI/APP），默认 VDI

# ── 策略（可多个）──
# strategy_id_arr: 留空则调 API 查询课程策略（space/strategygroup/vdi/list）
#   已知的课程策略ID 可在此配置：strategy_id_arr: [your-uuid-here]
strategy_id_arr:                         # 课程策略ID数组（可选；留空则调 API 查询）
strategy_name_vdi: [a_strategy_vdi_01]   # VDI 课程策略名
strategy_name_tci: [a_strategy_tci_01]   # TCI 课程策略名
initial_strategy_name:               # 初始策略名（镜像分配关联）

# ── 镜像（可多个）──
student_image_name: [TEST_WIN10_64_VDI_P]            # 学生镜像名
teacher_image_name: [TEST_WIN10_64_VDI_P]               # 教师镜像名
image_name: [TEST_WIN10_64_VDI_P]                # 镜像名（matchArr.fieldName=imageName，精确匹配）

# ── 桌面/座位 ──
# 命名规则：desktop_pre_name 为空随机生成（字母开头8位小写字母数字）；
#   desktop_name 按 seat_num 补齐（多座位只填一个时其余按 pre+序号 生成），完整列表见 desktop_name_arr；
#   computer_name 为空用前缀做 LIKE 匹配，一次命中全部桌面
desktop_name:                        # 桌面主机名（可空；带尾数字时推导前缀+起始值）
desktop_pre_name:                    # 桌面名前缀（可空→随机）
desktop_name_start_num:              # 桌面名起始值（可空→1）
computer_name:                       # 计算机名（matchArr.fieldName=computerName；可空→前缀）
seat_num: 1                           # 座位数（决定桌面名补齐个数）

# ── IP（可多个，与教室/桌面列表索引对应）──
teacher_ip: [1.1.1.1]                         # 教师机 IP
start_ip:                            # 起始 IP
end_ip:                              # 结束 IP
student_start_ip: [1.1.1.2]                   # 学生起始 IP
student_end_ip: [1.1.1.3]                     # 学生结束 IP

# ── 终端 IP（按终端类型，可多个）──
tci_terminal_ip:                     # TCI 终端 IP
vdi_terminal_ip:                     # VDI 终端 IP
idv_terminal_ip:                     # IDV 终端 IP

# ── 网络策略（可多选：值填列表，按列表索引依次取对应网络）──
network_id_arr: [1a054d1c-3ad6-46f6-94b8-657cda80bdaf]       # 网络策略ID数组（可选多个，逗号分隔；留空则不传 networkId 字段）
network_name_arr: [180]                                       # 网络策略名称（与 network_id_arr 索引对应；优先按名称匹配）
space_name:                          # 空间名
usb_type_id_arr:                     # USB 类型 ID 数组

# ── 配置规格（单个，不展开批量）──
cpu:                                 # CPU 核数
memory:                              # 内存 MB
system_size:                         # 系统盘 GB
expected_cpu:                        # 期望 CPU（一致性断言用）
expected_memory:                     # 期望内存（一致性断言用）
