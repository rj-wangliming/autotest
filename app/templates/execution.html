{% extends "base.html" %}
{% block content %}
<h2>▶️ 用例执行过程</h2>
<div class="toolbar">
    <input id="session-input" placeholder="Session ID（留空取最近一次）">
    <button class="btn btn-primary" onclick="startPoll()">查看执行</button>
    <span id="exec-status" class="muted"></span>
</div>

<div class="panel">
    <div class="panel-head"><span>实时日志</span></div>
    <div id="log-box" class="log-box"></div>
</div>

<div class="panel" id="result-panel" style="display:none">
    <div class="panel-head"><span>执行结果</span></div>
    <pre id="result-json"></pre>
</div>
<div class="panel" id="plan-panel" style="display:none">
    <div class="panel-head"><span>编排计划（⚡ = 规则自动补，可人工确认）</span></div>
    <pre id="plan-json" class="log-box" style="height:200px"></pre>
</div>
<div class="panel" id="script-panel" style="display:none">
    <div class="panel-head"><span>生成脚本（裸脚本，可独立运行）</span></div>
    <pre id="script-json" class="log-box" style="height:300px"></pre>
</div>
{% endblock %}
{% block scripts %}
<script>
let pollTimer = null;
function startPoll() {
    const sid = document.getElementById('session-input').value.trim();
    const url = new URLSearchParams(location.search).get('session');
    const target = sid || url || '';
    if (!target) { alert('请输入 Session ID'); return; }
    if (pollTimer) clearInterval(pollTimer);
    poll(target);
}
function poll(sid) {
    fetch(`/api/execution/${sid}`).then(r=>r.json()).then(d => {
        renderLogs(d.logs || []);
        document.getElementById('exec-status').textContent = '状态: ' + d.status;
        // 编排计划摘要（含规则自动补标记）
        if (d.plan_meta) {
            const pm = d.plan_meta;
            let t = (pm.channel || '') + '\n';
            if ((pm.rule_added || []).length) t += '⚡ 规则自动补 ' + pm.rule_added.length + ' 步：' + pm.rule_added.join(', ') + '\n';
            if ((pm.warns || []).length) t += '⚠️ 警告：' + pm.warns.map(w => (w.api||'') + ' 禁止 ' + (w.forbidden_state||'')).join('; ') + '\n';
            t += '\n步骤：\n';
            (pm.steps || []).forEach((s, i) => {
                t += '  ' + (i+1) + '. [' + (s.section||'') + '] ' + (s.step_name||'') + ' -> ' + s.api + (s.auto_by_rules ? ' ⚡' : '') + '\n';
            });
            document.getElementById('plan-panel').style.display = 'block';
            document.getElementById('plan-json').textContent = t;
        }
        if (d.script) {
            document.getElementById('script-panel').style.display = 'block';
            document.getElementById('script-json').textContent = d.script;
        }
        if (d.result) {
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('result-json').textContent = JSON.stringify(d.result, null, 2);
        }
        if (d.status === 'running') {
            pollTimer = setTimeout(() => poll(sid), 1000);
        } else {
            document.getElementById('exec-status').textContent = '状态: ' + d.status + '（完成）';
        }
    });
}
function renderLogs(logs) {
    const box = document.getElementById('log-box');
    const colors = {req:'#2563eb', resp:'#059669', info:'#6b7280', error:'#dc2626', step:'#7c3aed'};
    // XSS 防护：转义 msg 后再渲染
    function _esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    box.innerHTML = logs.map(l =>
        `<div class="log-line"><span class="log-ts">${_esc(l.ts)}</span> <span class="log-lv" style="color:${colors[l.level]||'#333'}">[${_esc(l.level)}]</span> ${_esc(l.msg)}</div>`
    ).join('');
    box.scrollTop = box.scrollHeight;
}
// 自动读取 URL 的 session 参数
(function(){ const s = new URLSearchParams(location.search).get('session'); if (s) { document.getElementById('session-input').value = s; startPoll(); } })();
</script>
{% endblock %}
