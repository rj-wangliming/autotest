# 用例文件（CI 可直接跑）
# name: 用例名（JUnit testcase 名）
# use_case: 用例文本（前置步骤：/执行步骤：/预测结果：三段，前置可空）
# params: 内联参数，覆盖 global_params.yaml 同名项
name: 重启VDI云桌面
use_case: |
  前置步骤：
      1、教室云桌面列表中有多个云桌面处于运行中
  执行步骤：
      1、教室详情 - 云桌面列表中选择多个正在运行的VDI云桌面点击【重启云桌面】按钮重启云桌面
  预测结果：
      1、勾选的云桌面重启成功
params:
  classroom_name: ci_classroom
  # 登录凭据走环境变量 TEST_ADMIN_USER / TEST_ADMIN_PASSWORD 注入（勿在此写明文）
  # admin_user: admin
  # admin_password: admin123
